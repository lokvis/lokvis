name: Deploy Web (Cloudflare Pages)

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# 避免并发部署冲突
concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.12.0'
  # Cloudflare Pages 项目名(在 Cloudflare 控制台创建后填入,或用环境变量覆盖)
  CF_PAGES_PROJECT: lokvis-web

jobs:
  deploy:
    name: Build & Deploy apps/web
    runs-on: ubuntu-latest
    # 仅在配置了 Cloudflare 凭据时运行,否则跳过(避免 fork PR 失败)
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository == 'lokvis/lokvis-open' }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build apps/web
        run: pnpm build --filter=@lokvis/web...

      - name: Determine deployment branch & env
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
            echo "env=production" >> "$GITHUB_OUTPUT"
          else
            # dev 及其它分支走 preview
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "env=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # main 分支 → production;其余分支 → preview
          command: pages deploy apps/web/dist --project-name=${{ env.CF_PAGES_PROJECT }} --branch=${{ steps.target.outputs.branch }}

      - name: Summary
        if: always()
        run: |
          echo "### Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Project:** ${{ env.CF_PAGES_PROJECT }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** ${{ steps.target.outputs.branch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment:** ${{ steps.target.outputs.env }}" >> "$GITHUB_STEP_SUMMARY"
