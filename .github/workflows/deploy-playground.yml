name: Deploy Playground

# W14.7: Playground 部署到 Cloudflare Pages（playground.lokvis.dev）。
# 触发条件：push 到 dev 分支且 apps/playground/** 有变更，或手动 workflow_dispatch。
#
# 生产域名 playground.lokvis.dev 在 Cloudflare Pages dashboard 配置 custom domain，
# 不在 workflow 里——本 workflow 只负责把 apps/playground/dist 推到 Pages 项目
# `lokvis-playground`，custom domain / DNS / HTTPS 证书均在 Cloudflare 控制台配置。
on:
  push:
    branches: [dev]
    paths:
      - 'apps/playground/**'
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '9.12.0'

# 部署不取消进行中的旧运行——避免半成品上线（旧部署可能正在写 production）。
# 等当前部署完成再启动新部署，保证 production 始终是完整构建。
concurrency:
  group: deploy-playground
  cancel-in-progress: false

jobs:
  deploy-playground:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    # 仅在 lokvis/lokvis 仓库执行，防止 fork 误触发部署
    if: github.repository == 'lokvis/lokvis'
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 全量构建：playground 依赖 @lokvis/* 子包的 dist 产物，必须先构建子包。
      - name: Build
        run: pnpm build

      # 部署 apps/playground/dist 到 Cloudflare Pages 项目 lokvis-playground。
      # wrangler-action 自动判断 production/preview：dev 分支 → production。
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/playground/dist --project-name=lokvis-playground --branch=${{ github.ref_name }}
