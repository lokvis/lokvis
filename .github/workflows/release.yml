name: Release

# 在 main 或 dev 分支上打 tag (v*) 时触发 npm 发布:
# - main 上的 tag → stable,发布到 latest dist-tag
# - dev  上的 tag → beta,  发布到 beta   dist-tag
# 常规 push 到 main/dev 只跑 CI (lint/typecheck/build/test),不发布。
on:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.12.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish packages to npm
    runs-on: ubuntu-latest
    # 仅在 lokvis/lokvis 仓库执行,防止 fork 误触发
    if: github.repository == 'lokvis/lokvis'
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整历史,用于判断 tag 所在分支

      - name: Detect release channel
        id: channel
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Tag: $TAG"

          # 拉取 main / dev 引用,用于判断 tag 所在分支
          git fetch origin main dev --no-tags --force 2>/dev/null || true
          SHA="${{ github.sha }}"

          CHANNEL="skip"
          DIST_TAG=""

          # 使用 merge-base --is-ancestor 判断 tag commit 是否为分支祖先
          # 比 `git branch -r --contains` 更可靠(不依赖远端分支 ref 的即时一致性)
          if git merge-base --is-ancestor "$SHA" origin/main 2>/dev/null; then
            CHANNEL="stable"
            DIST_TAG="latest"
          elif git merge-base --is-ancestor "$SHA" origin/dev 2>/dev/null; then
            CHANNEL="beta"
            DIST_TAG="beta"
          else
            # 兜底:若 tag 格式为 vX.Y.Z-<prerelease>(如 v0.2.0-beta.0),
            # 且未能匹配到任何分支,按命名约定视为 beta
            if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+$ ]]; then
              echo "::warning::Tag $TAG not found on main/dev; falling back to beta by naming convention"
              CHANNEL="beta"
              DIST_TAG="beta"
            fi
          fi

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::Detected channel: $CHANNEL (dist-tag: $DIST_TAG) for tag $TAG"

      - name: Setup pnpm
        if: steps.channel.outputs.channel != 'skip'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        if: steps.channel.outputs.channel != 'skip'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        if: steps.channel.outputs.channel != 'skip'
        run: pnpm install --frozen-lockfile

      - name: Build packages
        if: steps.channel.outputs.channel != 'skip'
        run: pnpm build

      - name: Publish to npm
        if: steps.channel.outputs.channel != 'skip'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          DIST_TAG: ${{ steps.channel.outputs.dist-tag }}
        run: |
          # 在 pre 模式下,changeset publish 不允许传 --tag(会报 "Releasing under
          # custom tag is not allowed in pre mode")。此时版本已由 changeset
          # version 提升为 X.Y.Z-<prerelease>,直接用 npm publish 逐包发布。
          if [ -f .changeset/pre.json ]; then
            echo "::notice::Pre mode detected. Publishing each package via npm publish --tag $DIST_TAG"

            # 遍历 packages 下每个非 private 包执行 npm publish
            for pkg_dir in packages/*/; do
              pkg_json="${pkg_dir}package.json"
              [ -f "$pkg_json" ] || continue
              private=$(node -e "console.log(require('./$pkg_json').private || false)")
              [ "$private" = "true" ] && continue
              name=$(node -e "console.log(require('./$pkg_json').name)")
              version=$(node -e "console.log(require('./$pkg_json').version)")
              # 跳过已发布版本(避免 403)
              if npm view "${name}@${version}" version >/dev/null 2>&1; then
                echo "::notice::${name}@${version} already published, skipping"
                continue
              fi
              echo "::group::Publishing ${name}@${version}"
              (cd "$pkg_dir" && npm publish --tag "$DIST_TAG" --access public --provenance)
              echo "::endgroup::"
            done
          else
            # 稳定发布:使用 changeset publish,消耗已应用的 changesets
            pnpm changeset publish --tag "$DIST_TAG"
          fi
