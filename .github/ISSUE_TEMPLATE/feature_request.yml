name: ✨ 功能建议
description: 提出新功能或对现有功能的改进建议
title: "[Feature]: "
labels: ["feature", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出建议!请先**搜索现有 Issue** 避免重复。

        📋 Lokvis 是 **Local-first 浏览器工作区平台**,所有处理在浏览器中完成。
        与"上传到服务器处理"或"AI 对话工具"无关的建议可能不在 Phase 1 范围内
        (见 [PROJECT_PLAN.md §11 不做清单](docs/PROJECT_PLAN.md))。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能要解决什么问题?当前是怎么做的(变通方案)?
      placeholder: |
        我每次都要批量压缩多张图片,但 BatchQueue 只支持 compress,
        无法批量 resize。当前我只能一张张手动处理...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 设想的解决方案
      description: 你希望 Lokvis 怎么做?描述期望的功能 / UI / 工作流。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 为什么现有工具 / 别的方案不够好?这能帮我们理解需求的边界。
    validations:
      required: false

  - type: dropdown
    id: layer
    attributes:
      label: 涉及的架构层
      description: 多选可放在"其他说明"中。详见 [架构文档](docs/architecture.md)。
      options:
        - UI(playground / ui-react)
        - Workflow(工作流编辑 / 模板)
        - Runtime(调度 / 资产 / 历史)
        - Capability(plugin-* 能力扩展)
        - Engine(图像 / 视频 / PDF / 音频 / AI)
        - 不确定 / 跨层
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: 期望的阶段
      description: Phase 1 还是 Phase 2+?(Phase 1 不含 Video / PDF / Audio / AI Workspace)
      options:
        - Phase 1(MVP,2026.12 前)
        - Phase 2(2027)
        - 不确定
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 其他说明
      description: 截图、参考链接、相关 Issue / PR、用例细节等。
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue,确认这是新建议
          required: true
        - label: 我已查阅 PROJECT_PLAN.md §11 不做清单,确认该建议不在此范围
          required: true
