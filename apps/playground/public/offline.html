<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Offline · Lokvis Playground</title>
    <meta name="theme-color" content="#6366f1" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          'Segoe UI', sans-serif;
        background: #09090b;
        color: #e4e4e7;
      }
      .container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 480px;
        width: 100%;
        text-align: center;
        padding: 40px 32px;
        border: 1px solid #27272a;
        border-radius: 16px;
        background: rgba(24, 24, 27, 0.6);
        backdrop-filter: blur(8px);
      }
      .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        background: linear-gradient(135deg, #6366f1, #a855f7);
        font-size: 28px;
        color: #fff;
        font-weight: 700;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.6;
        color: #a1a1aa;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 9999px;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.2);
        color: #fca5a5;
        font-size: 11px;
        font-weight: 500;
        margin-bottom: 16px;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #ef4444;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 10px 20px;
        border-radius: 8px;
        border: 1px solid #3f3f46;
        background: #18181b;
        color: #e4e4e7;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s;
      }
      button:hover {
        background: #27272a;
        border-color: #52525b;
      }
      .meta {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid #27272a;
        font-size: 11px;
        color: #71717a;
      }
      a {
        color: #818cf8;
        text-decoration: none;
      }
      a:hover {
        color: #a5b4fc;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="icon">◆</div>
        <div class="badge">
          <span class="dot"></span>
          <span>You are offline</span>
        </div>
        <h1>No network connection</h1>
        <p>
          Lokvis Playground runs locally in your browser — once the engine is
          cached, you can keep processing images even offline. Reconnect to load
          uncached pages or install the PWA for full offline access.
        </p>
        <button onclick="location.reload()">↻ Try again</button>
        <div class="meta">
          <div>Need help? Visit <a href="https://lokvis.com">lokvis.com</a></div>
          <div style="margin-top: 4px">PWA · W15.6 fallback page</div>
        </div>
      </div>
    </div>
    <script>
      // 网络恢复后自动重载(W15.5 配合)
      window.addEventListener('online', () => {
        location.reload();
      });
    </script>
  </body>
</html>
